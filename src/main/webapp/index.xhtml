<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core">

<h:head>
    <title>Conversation</title>
    <h:outputStylesheet library="css" name="mycsslayout.css"/>
</h:head>

<h:body>
    <h:form id="form">

        <!-- Afficher les erreurs globales et celles des champs -->
        <h:messages showDetail="true"
                    showSummary="false"
                    style="color: red"/>

        <h:outputLabel for="rolesysteme" value="Rôle : "/>

        <h:selectOneMenu id="rolesysteme"
                         value="#{bb.roleSysteme}"
                         required="true"
                         requiredMessage="Choisissez un rôle."
                         disabled="#{!bb.roleSystemeChangeable}">
            <f:selectItems value="#{bb.rolesSysteme}"/>
        </h:selectOneMenu>

        <h:commandButton value="Nouveau chat"
                         action="#{bb.nouveauChat}"
                         immediate="true"/>

        <h:panelGrid columns="2"
                     columnClasses="topAligned,topAligned"
                     style="width: 100%; margin-top: 20px;">

            <!-- Colonne gauche -->
            <h:panelGroup layout="block">

                <h:outputLabel for="question" value="Question :"/>
                <br/>

                <h:inputTextarea id="question"
                                 value="#{bb.question}"
                                 cols="50"
                                 rows="5"/>

                <br/>

                <h:commandButton value="Envoyer la question"
                                 action="#{bb.envoyer}"/>

                <br/><br/>

                <h:outputLabel for="reponse" value="Réponse :"/>
                <br/>

                <h:inputTextarea id="reponse"
                                 value="#{bb.reponse}"
                                 readonly="true"
                                 cols="50"
                                 rows="15"/>

            </h:panelGroup>

            <!-- Colonne droite -->
            <h:panelGroup layout="block">

                <h:outputLabel for="historique"
                               value="Historique de la conversation :"/>
                <br/>

                <h:inputTextarea id="historique"
                                 value="#{bb.conversation}"
                                 readonly="true"
                                 cols="50"
                                 rows="25"/>

            </h:panelGroup>

        </h:panelGrid>

    </h:form>
</h:body>
</html>
